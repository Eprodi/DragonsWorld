<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#122a44">
  <title>Dragons World — Santuário dos Dragões</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game-shell">
    <header class="topbar">
      <a class="brand" href="#" aria-label="Dragons World início"><span class="brand-mark">✦</span><span>DRAGONS <b>WORLD</b></span></a>
      <div class="resources" aria-label="Recursos">
        <div class="resource"><span>🪙</span><strong id="coins">120</strong></div>
        <div class="resource"><span>🍓</span><strong id="food">8</strong></div>
        <div class="level"><span>NV</span><strong id="player-level">1</strong></div>
      </div>
    </header>

    <section class="island" aria-label="Seu santuário">
      <div class="island-title"><span>SEU SANTUÁRIO · ILHA <b id="island-number">1</b></span><h1 id="island-name">Ilha do Começo</h1></div>
      <button class="clear-mode" id="clear-mode-btn" aria-pressed="false">⛏️ Limpar terreno</button>
      <canvas id="world-canvas" class="world-canvas" aria-label="Ilha flutuante 3D. Ative Limpar terreno e toque nas árvores e pedras. Arraste para girar a câmera."></canvas>
      <div class="dragon-tag"><span class="tag-dot"></span><div><strong id="dragon-name">Luma</strong><small id="dragon-detail">Dragão de Fogo · Nv. 1</small></div><span class="mood" id="mood">☺</span></div>
      <div class="island-footer"><span>☀️ Dia tranquilo</span><span id="status">Luma está feliz em ver você!</span></div>
    </section>

    <section class="actions" aria-label="Ações do jogo">
      <button class="action-card primary" id="feed-btn"><span class="action-icon">🍓</span><span class="action-copy"><strong>Alimentar</strong><small id="feed-hint">Ganha experiência e moedas</small></span><span class="action-arrow">›</span></button>
      <button class="action-card" id="collect-btn"><span class="action-icon coin-icon">🪙</span><span class="action-copy"><strong>Coletar moedas</strong><small>Renda do habitat</small></span><span class="action-arrow">›</span></button>
      <button class="action-card" id="egg-btn"><span class="action-icon">🏝️</span><span class="action-copy"><strong>Comprar ilha</strong><small id="island-price">250 moedas · nova área</small></span><span class="action-arrow">›</span></button>
      <button class="action-card" id="food-btn"><span class="action-icon">🧺</span><span class="action-copy"><strong>Comprar frutas</strong><small>5 frutas por 25 moedas</small></span><span class="action-arrow">›</span></button>
    </section>

    <section class="collection" id="collection" aria-label="Coleção de dragões">
      <div class="collection-heading"><div><span>SUA COLEÇÃO</span><h2>Dragões</h2></div><strong id="dragon-count">1 dragão</strong><button id="close-collection" aria-label="Fechar coleção">×</button></div>
      <div class="element-legend" aria-label="Elementos disponíveis"><span class="element-chip fire">🔥 Fogo</span><span class="element-chip water">💧 Água</span><span class="element-chip earth">🌱 Terra</span><span class="element-chip air">🌬️ Ar</span></div>
      <div class="dragon-list" id="dragon-list"></div>
    </section>
    <nav class="bottom-nav" id="bottom-nav" aria-label="Navegação">
      <a class="nav-item active" href="#"><span>🏝️</span><small>Ilhas</small></a>
      <a class="nav-item" href="#collection"><span>🐉</span><small>Dragões</small></a>
      <a class="nav-item" href="#food-btn"><span>🛍️</span><small>Mercado</small></a>
      <a class="nav-item" href="#quests"><span>📜</span><small>Missões</small></a>
    </nav>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
  <script src="game.js"></script>
  <script src="world.js"></script>
</body>
</html>
